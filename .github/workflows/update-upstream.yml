name: Track upstream Norish releases

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: Force a specific Norish tag (e.g. v0.23.1-beta); empty = newest release
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      norish_tag: ${{ steps.upstream.outputs.norish_tag }}
      obscura_tag: ${{ steps.upstream.outputs.obscura_tag }}
      changed: ${{ steps.upstream.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine newest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          current_norish="$(yq -r '.version' norish/config.yaml)"
          current_obscura="$(yq -r '.version' norish_obscura/config.yaml)"

          if [[ -n "${FORCED_TAG}" ]]; then
            tag="${FORCED_TAG}"
          else
            # Source of truth is the image registry, not the GitHub releases
            # page: Norish sometimes tags a hotfix (e.g. v0.23.1-beta) and
            # publishes its image without creating a GitHub release for it.
            # Take the highest version tag that exists for both arm64 and
            # amd64; "rc-*" and "latest" are ignored.
            tag="$(curl -fsSL 'https://hub.docker.com/v2/repositories/norishapp/norish/tags?page_size=100' \
                   | jq -r '.results[]
                            | select(.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[A-Za-z0-9.]+)?$"))
                            | select(([.images[].architecture] | index("arm64") != null and index("amd64") != null))
                            | .name' \
                   | sort -V | tail -n1)"
          fi
          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "::error::could not determine upstream tag"
            exit 1
          fi

          # Never move backwards: if the candidate sorts below the version the
          # add-on already ships, leave everything untouched. For the
          # comparison a version without pre-release suffix gets a suffix that
          # sorts after "-beta", so 0.23.1 counts as newer than 0.23.1-beta.
          sort_key() { if [[ "$1" == *-* ]]; then echo "$1"; else echo "$1-zzzz"; fi; }
          highest="$(printf '%s\n%s\n' "$(sort_key "${current_norish}")" "$(sort_key "${tag#v}")" | sort -V | tail -n1)"
          if [[ -z "${FORCED_TAG}" && "${highest}" != "$(sort_key "${tag#v}")" ]]; then
            echo "Upstream ${tag} is not newer than the current ${current_norish}, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A forced tag must still exist for both architectures.
          if ! curl -fsSL "https://hub.docker.com/v2/repositories/norishapp/norish/tags/${tag}" \
               | jq -e '[.images[].architecture] | (index("arm64") != null and index("amd64") != null)' >/dev/null; then
            echo "::warning::norishapp/norish:${tag} is not on Docker Hub for arm64 and amd64, trying again next run"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Obscura tag pinned by that release.
          obscura="$(curl -fsSL "https://raw.githubusercontent.com/norish-recipes/norish/${tag}/docker/obscura/pin.env" \
                     | sed -n 's/^OBSCURA_IMAGE_TAG=//p' | tr -d '[:space:]' || true)"

          changed=false
          if [[ "${tag#v}" != "${current_norish}" ]]; then changed=true; fi
          if [[ -n "${obscura}" && "${obscura}" != "${current_obscura}" ]]; then changed=true; fi

          echo "norish_tag=${tag}"      >> "$GITHUB_OUTPUT"
          echo "obscura_tag=${obscura}" >> "$GITHUB_OUTPUT"
          echo "changed=${changed}"     >> "$GITHUB_OUTPUT"
          echo "upstream=${tag} (obscura ${obscura:-n/a}); current=${current_norish} / ${current_obscura}; changed=${changed}"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply version bump (working tree only)
        run: scripts/bump.sh "${{ needs.check.outputs.norish_tag }}" "${{ needs.check.outputs.obscura_tag }}"
      - uses: ./.github/actions/build-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  commit:
    # Runs only after the image is in the registry, so Home Assistant never
    # sees a version it cannot pull yet.
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply version bump
        run: scripts/bump.sh "${{ needs.check.outputs.norish_tag }}" "${{ needs.check.outputs.obscura_tag }}"
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Norish to ${{ needs.check.outputs.norish_tag }}"
          git push
