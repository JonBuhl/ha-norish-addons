name: Build add-on images

on:
  push:
    branches: [main]
    paths:
      - "norish/**"
      - "norish_obscura/**"
      - ".github/actions/build-image/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the tag already exists
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [norish, norish_obscura]
    steps:
      - uses: actions/checkout@v4
      # Each add-on skips its build when its "<image>:<version>" already exists.
      - uses: ./.github/actions/build-image
        with:
          addon: ${{ matrix.addon }}
          force: ${{ inputs.force || 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}
