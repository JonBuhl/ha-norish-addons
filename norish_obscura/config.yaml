name: Norish Obscura
version: "0.2.4-norish.1-ha1"
slug: norish_obscura
description: Headless browser used by Norish to render recipe pages for URL imports
url: https://github.com/jonbuhl/ha-norish-addons
arch:
  - aarch64
  - amd64
# The image is built by GitHub Actions in this repository (see .github/) from
# the binaries of norishapp/obscura. The upstream tag is pinned by the
# OBSCURA_TAG default in ./Dockerfile and updated automatically by
# .github/workflows/update-upstream.yml together with the Norish add-on.
# Home Assistant pulls "<image>:<version>", so version must equal the image tag.
image: ghcr.io/jonbuhl/norish-obscura-addon
init: false
startup: services
boot: auto
# The CDP token shared with the Norish add-on lives in /share/norish.
map:
  - type: share
    read_only: false
# No host port on purpose: anyone who can reach the CDP port can drive the
# browser. The Norish add-on reaches it over the internal add-on network.
options: {}
schema: {}
